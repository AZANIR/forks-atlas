  </g>
  <g transform="translate(134.0 95.0) scale(1.1818)" fill="none" stroke="#ffffff" stroke-width="2.88" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 8 L35.5 15.5 V30 L22 37.5 L8.5 30 V15.5 Z"/>
      <path d="M8.5 15.5 L22 23 L35.5 15.5"/>
      <path d="M22 23 V37.5"/></g>

  <text x="160" y="212" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.4">LLM-інфра</text>
