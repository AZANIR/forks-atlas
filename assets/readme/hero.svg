<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Атлас проєктів: 286 проєктів у 11 категоріях">
  <title>Атлас проєктів — робочий стіл</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2350"/>
      <stop offset="0.45" stop-color="#1b1b3a"/>
      <stop offset="1" stop-color="#141428"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#6f5bff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6f5bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#wall)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>

    <!-- Рядок меню: напівпрозорий шар поверх шпалер, як у macOS. -->
    <rect width="1200" height="46" fill="#ffffff" fill-opacity="0.10"/>
    <path d="M0 46 H1200" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="34" cy="23" r="8" fill="#f5f5f7" fill-opacity="0.9"/>
    <text x="58" y="31" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20"
          font-weight="650">Атлас</text>
    <text x="130" y="31" fill="#f5f5f7" fill-opacity="0.62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="20">Категорії</text>
    <text x="228" y="31" fill="#f5f5f7" fill-opacity="0.62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="20">Джерела</text>
    <text x="320" y="31" fill="#f5f5f7" fill-opacity="0.62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="20">Оновлення</text>
    <text x="1168" y="31" text-anchor="end" fill="#f5f5f7" fill-opacity="0.72"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20">29.07.2026</text>

    <!-- Великий кегль просить від'ємного трекінгу: інакше літери розповзаються. -->
    <text x="56" y="176" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66"
          font-weight="700" letter-spacing="-1.4">Атлас проєктів</text>
    <text x="56" y="222" fill="#f5f5f7" fill-opacity="0.66" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="25" letter-spacing="-0.1">Що варте уваги в AI-агентах, безпеці та
      автоматизації — розкладене по теках</text>

    <g><rect x="56" y="262" width="198" height="52" rx="26" fill="#0a84ff" fill-opacity="0.16"/><rect x="56" y="262" width="198" height="52" rx="26" fill="none" stroke="#0a84ff" stroke-opacity="0.42"/><circle cx="82" cy="288" r="6" fill="#0a84ff"/><text x="100" y="295" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="500">286 проєктів</text></g><g><rect x="270" y="262" width="186" height="52" rx="26" fill="#ff9f0a" fill-opacity="0.16"/><rect x="270" y="262" width="186" height="52" rx="26" fill="none" stroke="#ff9f0a" stroke-opacity="0.42"/><circle cx="296" cy="288" r="6" fill="#ff9f0a"/><text x="314" y="295" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="500">7 343 240 ★</text></g><g><rect x="472" y="262" width="198" height="52" rx="26" fill="#bf5af2" fill-opacity="0.16"/><rect x="472" y="262" width="198" height="52" rx="26" fill="none" stroke="#bf5af2" stroke-opacity="0.42"/><circle cx="498" cy="288" r="6" fill="#bf5af2"/><text x="516" y="295" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="500">11 категорій</text></g>
  </g>
</svg>
