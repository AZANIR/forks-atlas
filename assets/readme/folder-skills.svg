<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 252" width="164" height="129" role="img" aria-label="Тека «Skills»">
  <title>Тека «Skills»</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#1a1a1d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e16aff"/>
      <stop offset="1" stop-color="#b053df"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000"
                    flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="320" height="252" rx="28" fill="url(#tile)"/>
  <!-- Верхня грань ловить світло: так поверхня читається як матеріал, а не заливка. -->
  <rect x="1" y="1" width="318" height="250" rx="27" fill="none"
        stroke="#ffffff" stroke-opacity="0.09"/>
  <path d="M29 1 H291" fill="none" stroke="#ffffff" stroke-opacity="0.16"
        stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="80" y="44" width="68" height="34" rx="11" fill="#8a41ae"/>
    <rect x="80" y="60" width="160" height="104" rx="16" fill="#9546bd"/>
    <rect x="80" y="78" width="160" height="86" rx="16" fill="url(#front)"/>
    <path d="M96 79 H224" fill="none" stroke="#ffffff" stroke-opacity="0.34"
          stroke-width="1.5"/>
  </g>
  <g transform="translate(134.0 95.0) scale(1.1818)" fill="none" stroke="#ffffff" stroke-width="2.88" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11 L38.5 18 L22 25 L5.5 18 Z"/>
      <path d="M12 21.2 v7.8 c0 3 4.5 5 10 5 s10 -2 10 -5 v-7.8"/>
      <path d="M35.5 19.5 V30"/></g>

  <text x="160" y="212" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="-0.4">Skills</text>
</svg>
